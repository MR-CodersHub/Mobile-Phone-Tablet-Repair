<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" fill="none">
  <defs>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5500" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5500" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Desk surface -->
  <rect x="20" y="250" width="360" height="8" rx="4" fill="#ff5500" fill-opacity="0.2"/>
  <rect x="30" y="258" width="340" height="3" rx="1.5" fill="#ff5500" fill-opacity="0.1"/>

  <!-- Desk gradient background -->
  <rect x="30" y="200" width="340" height="58" rx="8" fill="url(#deskGrad)"/>

  <!-- Glow behind device -->
  <ellipse cx="200" cy="180" rx="80" ry="60" fill="url(#glowGrad)" filter="url(#softGlow)"/>

  <!-- Phone body -->
  <rect x="155" y="110" width="90" height="175" rx="12" fill="#2a2a3e" stroke="#ff5500" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Phone screen -->
  <rect x="162" y="120" width="76" height="130" rx="6" fill="url(#screenGrad)"/>
  <!-- Screen content - lines -->
  <rect x="172" y="135" width="56" height="4" rx="2" fill="#ff5500" fill-opacity="0.3"/>
  <rect x="172" y="147" width="40" height="4" rx="2" fill="#fff" fill-opacity="0.1"/>
  <rect x="172" y="159" width="56" height="4" rx="2" fill="#fff" fill-opacity="0.08"/>
  <rect x="172" y="171" width="30" height="4" rx="2" fill="#fff" fill-opacity="0.08"/>
  <!-- Battery icon on screen -->
  <rect x="220" y="125" width="10" height="6" rx="1.5" fill="#00ff66" fill-opacity="0.6"/>
  <!-- Home button -->
  <circle cx="200" cy="272" r="5" fill="none" stroke="#ff5500" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Camera dot -->
  <circle cx="200" cy="117" r="3" fill="#ff5500" fill-opacity="0.5"/>

  <!-- Crack on screen -->
  <path d="M175 150 L195 180 L188 200" stroke="#ff5500" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
  <path d="M195 180 L210 185" stroke="#ff5500" stroke-width="1" stroke-opacity="0.3" fill="none"/>

  <!-- Screwdriver tool left -->
  <g transform="rotate(-25, 110, 230)">
    <rect x="100" y="220" width="6" height="45" rx="2" fill="#888" fill-opacity="0.6"/>
    <rect x="101" y="215" width="4" height="10" rx="1" fill="#ff5500" fill-opacity="0.6"/>
    <rect x="102" y="210" width="2" height="6" rx="1" fill="#ccc" fill-opacity="0.4"/>
  </g>

  <!-- Small screw -->
  <circle cx="130" cy="240" r="4" fill="#888" fill-opacity="0.4"/>
  <line x1="128" y1="240" x2="132" y2="240" stroke="#aaa" stroke-width="0.8"/>
  <line x1="130" y1="238" x2="130" y2="242" stroke="#aaa" stroke-width="0.8"/>

  <!-- Small screw 2 -->
  <circle cx="280" cy="245" r="3" fill="#888" fill-opacity="0.3"/>

  <!-- Tweezers right -->
  <g transform="rotate(15, 290, 230)">
    <path d="M285 220 L290 260 L288 262 L283 260 Z" fill="#ccc" fill-opacity="0.5"/>
    <path d="M293 220 L288 260 L290 262 L295 260 Z" fill="#ccc" fill-opacity="0.5"/>
  </g>

  <!-- Magnifying glass -->
  <g transform="translate(310, 140)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#ff5500" stroke-width="2.5" stroke-opacity="0.4"/>
    <circle cx="0" cy="0" r="22" fill="#ff5500" fill-opacity="0.05"/>
    <circle cx="0" cy="0" r="18" fill="#ff5500" fill-opacity="0.02"/>
    <!-- Lens crosshair -->
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#ff5500" stroke-width="0.5" stroke-opacity="0.2"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#ff5500" stroke-width="0.5" stroke-opacity="0.2"/>
    <!-- Handle -->
    <rect x="-2" y="22" width="4" height="25" rx="2" fill="#ff5500" fill-opacity="0.3"/>
  </g>

  <!-- Small circuit board traces bottom right -->
  <g opacity="0.15">
    <rect x="330" y="240" width="2" height="15" fill="#ff5500"/>
    <rect x="340" y="235" width="2" height="20" fill="#ff5500"/>
    <line x1="331" y1="245" x2="341" y2="245" stroke="#ff5500" stroke-width="1"/>
    <circle cx="345" cy="248" r="2" fill="#ff5500"/>
    <circle cx="335" cy="238" r="1.5" fill="#ff5500"/>
  </g>

  <!-- Chip/IC component -->
  <rect x="330" y="200" width="12" height="10" rx="1" fill="#ff5500" fill-opacity="0.08" stroke="#ff5500" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- ESD mat -->
  <rect x="40" y="248" width="320" height="3" rx="1" fill="#00ff66" fill-opacity="0.08"/>

  <!-- Label -->
  <text x="200" y="315" text-anchor="middle" font-family="monospace" font-size="11" fill="#ff5500" fill-opacity="0.4" letter-spacing="3">FIXPOINT LAB</text>
</svg>
